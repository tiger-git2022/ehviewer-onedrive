# Builds the release APKs. On main every push becomes a GitHub Release, like the Mihon fork
# (tiger-git2022/mihon, .github/workflows/tiger-release.yml):
#
# Version scheme: the fork's own semantic version, tag "vX.Y.Z". .github/fork-version holds X.Y: a pull request with a
# new feature (or an upstream update) raises Y, a big change (a redesign, a sync format older builds can't read)
# raises X. Z counts the releases of X.Y from 0, so a fix needs no edit. versionCode is
# 200000000 + X * 10000000 + Y * 10000 + Z (app/build.gradle.kts), above the earlier "v<upstream>-tNNN" releases
# (v1.15.0-t001 to t130, versionCode 180063 * 1000 + N). The in-app updater compares versions the same way
# (updater/ForkVersion.kt). Runs on other branches (workflow_dispatch) only build and test.
name: Build APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.forgejo/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if this commit has already been released'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push waits for the runs before it (not only the latest pending one), so each gets its own release and build
  # numbers never collide. queue: max does not allow cancel-in-progress.
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build:
    name: Build default release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool m4

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The release notes list the commits since the previous release
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | head -n 1)
          if [ "$PUBLISH" = "true" ] && [ -n "$existing" ] && [ "$FORCE" != "true" ]; then
            echo "Commit ${GITHUB_SHA::7} was already released as $existing, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_name=$(sed -nE 's/^[[:space:]]*"([0-9][0-9.]*)-SNAPSHOT".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$upstream_name" ]; then
            echo "::error::Could not read the upstream version from app/build.gradle.kts"
            exit 1
          fi
          series=$(tr -d '[:space:]' < .github/fork-version)
          if ! [[ "$series" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.github/fork-version must hold MAJOR.MINOR, such as 3.18, not '$series'"
            exit 1
          fi
          last=$(git tag --list "v${series}.*" | sed "s/^v${series}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -n "$last" ]; then patch=$(( last + 1 )); else patch=0; fi
          version_name="$series.$patch"
          # A lower X.Y in .github/fork-version would publish a release older than the latest one
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$newest" ] && [ "$(printf '%s\n' "$newest" "v$version_name" | sort -V | tail -n 1)" != "v$version_name" ]; then
            echo "::error::v$version_name would be older than $newest, raise .github/fork-version"
            exit 1
          fi
          IFS=. read -r major minor <<< "$series"
          {
            echo "skip=false"
            echo "publish=$PUBLISH"
            echo "upstream_name=$upstream_name"
            echo "version_name=$version_name"
            echo "version_code=$(( 200000000 + major * 10000000 + minor * 10000 + patch ))"
            echo "tag=v$version_name"
          } >> "$GITHUB_OUTPUT"
          echo "Version v$version_name, upstream $upstream_name (publish: $PUBLISH)"

      - name: Setup Java
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Android SDK
        if: steps.version.outputs.skip != 'true'
        uses: android-actions/setup-android@v4

      - name: Setup Rust
        if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          targets: aarch64-linux-android, thumbv7neon-linux-androideabi, x86_64-linux-android
          components: rust-src

      - name: Rust Cache
        if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"

      - name: Setup Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: CMake Cache
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-default-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-default-

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew assembleDefaultRelease -Ptiger.version=${{ steps.version.outputs.version_name }}

      - name: Unit tests
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew testDefaultDebugUnitTest

      - name: Collect APKs
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/default/release
          mkdir release
          # The in-app updater picks the APK whose name contains the ABI of the device, else the universal one
          mv "$OUT/app-default-arm64-v8a-release.apk"   "release/EhViewer-$TAG-arm64-v8a.apk"
          mv "$OUT/app-default-universal-release.apk"   "release/EhViewer-$TAG-universal.apk"
          mv "$OUT/app-default-armeabi-v7a-release.apk" "release/EhViewer-$TAG-armeabi-v7a.apk"
          mv "$OUT/app-default-x86_64-release.apk"      "release/EhViewer-$TAG-x86_64.apk"
          ls -lh release

      - name: Upload APKs
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EhViewer-${{ steps.version.outputs.tag }}
          path: release/*.apk

      - name: Upload mapping
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.version.outputs.tag }}
          path: app/build/outputs/mapping/defaultRelease/*.txt

      # Notes are Chinese first, then English: PR titles are written as "中文 / English".
      - name: Write release notes
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          UPSTREAM: ${{ steps.version.outputs.upstream_name }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ]; then
            commits=$(git rev-list --first-parent "$previous..HEAD")
            changes=""
          else
            commits=$(git rev-list --first-parent -n 20 HEAD)
            changes="第一个编号版本，下面是最近的提交。/ First numbered release, the latest commits:"$'\n\n'
          fi
          for commit in $commits; do
            subject=$(git log -1 --format=%s "$commit")
            # A merge commit of a pull request has the pull request title as its first body line
            if [ "$(git rev-list --parents -n 1 "$commit" | wc -w)" -gt 2 ]; then
              title=$(git log -1 --format=%b "$commit" | sed -n '/./{p;q}')
              subject="${title:-$subject}"
            fi
            changes+="- $subject (${commit::7})"$'\n'
          done
          cat > release-notes.md <<EOF
          基于上游 [EhViewer](https://codeberg.org/EhViewer/EhViewer) $UPSTREAM，附加 OneDrive 同步（设置、收藏、历史、阅读进度、快速搜索、搜索建议）和给 Mihon 改版用的收藏清单。

          ### 本次更新
          ${changes:-- 无代码改动}
          ### 下载
          - 大多数手机选 \`EhViewer-$TAG-arm64-v8a.apk\`
          - 不确定就选通用版 \`EhViewer-$TAG-universal.apk\`

          包名 \`moe.tarsin.ehviewer\`，签名和官方版相同，可以直接覆盖安装，数据保留。versionCode $VERSION_CODE。

          ---

          Based on upstream [EhViewer](https://codeberg.org/EhViewer/EhViewer) $UPSTREAM, with OneDrive sync and a favorites list for the Mihon fork. The changes are listed above.

          **Download:** most phones take \`EhViewer-$TAG-arm64-v8a.apk\`; if unsure, the universal \`EhViewer-$TAG-universal.apk\`. Package \`moe.tarsin.ehviewer\`, signed like the official build, so it installs over it and keeps the data. versionCode $VERSION_CODE.
          EOF
          cat release-notes.md

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/*.apk \
            --target "$GITHUB_SHA" \
            --title "EhViewer $TAG" \
            --notes-file release-notes.md \
            --latest
          .github/scripts/upload-update-manifest.sh "$TAG"
          # The single nightly pre-release of the earlier scheme is replaced by these releases
          gh release delete nightly --cleanup-tag --yes || true
